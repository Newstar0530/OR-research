[project]
name = "research-automation-agent"
version = "0.1.0"
description = "Template-based multi-agent research automation assistant for Industrial Engineering and Operations Research."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
  "pandas>=2.0",
  "numpy>=1.24",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
  "pypdf>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
optimization = ["pyomo>=6.0", "ortools>=9.8", "scipy>=1.10", "networkx>=3.0"]
code-editing = ["aider-chat>=0.85"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
